name: Blueprint CI

on:
  push:
    branches: [main]
    paths:
      - "projects/10-spring-boot-blueprint/**"
      - ".github/workflows/blueprint-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/10-spring-boot-blueprint/**"
      - ".github/workflows/blueprint-ci.yml"

defaults:
  run:
    working-directory: projects/10-spring-boot-blueprint

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: 112233
          MYSQL_DATABASE: spring-boot-blueprint
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p112233"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw verify -B

      - name: Build jar
        run: ./mvnw clean package -DskipTests -B

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-blueprint-jar
          path: projects/10-spring-boot-blueprint/target/*.jar
          retention-days: 7
